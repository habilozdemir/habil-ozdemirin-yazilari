name: Deploy
on:
  push:
    branches:
      - main
    paths:
      - '*.pdf'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  convert_pdf:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - run: |
          mkdir -p _site
          echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Yazılar</title></head><body><h1>Yazılar</h1><ul>" > _site/index.html
          
          for file in *.pdf; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .pdf)
              node -e "
                const { execSync } = require('child_process');
                try {
                  execSync('docker run --rm -v \x22' + process.cwd() + ':/pdf\x22 jreleese/pdf2htmlex pdf2htmlEX --embed-css 1 --embed-font 1 \x22/pdf/' + '$file' + '\x22 \x22/pdf/_site/' + '$filename' + '.html\x22');
                } catch (e) {
                  console.log(e);
                }
              "
              echo "<li><a href='./$filename.html'>$filename</a></li>" >> _site/index.html
            fi
          done
          
          echo "</ul></body></html>" >> _site/index.html

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
